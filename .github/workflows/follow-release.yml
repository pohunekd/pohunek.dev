name: Follow pohunek releases

# Moves the pin in pohunek.config.json to the latest stable pohunek release,
# checks that the site still tests and builds at that release, pushes the bump
# to main and starts a deploy. A push made with GITHUB_TOKEN does not start
# other workflows, so the deploy is started explicitly through
# workflow_dispatch, which GitHub exempts from that rule.
#
# The verify job installs and runs third-party build code, so it holds a
# read-only token. Only the publish job, which installs nothing, can push, and
# only the deploy job can start workflows; a failed dispatch is retried by
# re-running that job alone.
#
# Scheduled workflows of a public repository are disabled after 60 days
# without repository activity. A manual run (workflow_dispatch) is the fallback
# and re-enables the schedule. The repository_dispatch trigger lets the
# upstream release workflow ping this one once it holds a dispatch token.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Newer release tag to pin, vX.Y.Z (default: latest stable release)"
        required: false
        type: string
  repository_dispatch:
    types: [pohunek-release]

permissions: {}

concurrency:
  group: follow-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # The astro CLI runs on Node and needs a newer release than the runner image ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Move the pin to the release
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted input; bump-pin.ts rejects anything but a stable vX.Y.Z tag.
          REQUESTED_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            repository="$(jq -er .repository pohunek.config.json)"
            # releases/latest skips drafts and pre-releases.
            tag="$(gh api "repos/$repository/releases/latest" --jq .tag_name)"
          fi
          ref="$(bun scripts/bump-pin.ts "$tag")"
          if git diff --quiet -- pohunek.config.json; then
            echo "pin already at $ref"
          else
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pin.outputs.ref != ''
        run: bun install --frozen-lockfile
      - if: steps.pin.outputs.ref != ''
        run: bun test
      - if: steps.pin.outputs.ref != ''
        run: bun run build

  publish:
    needs: verify
    if: needs.verify.outputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # bump-pin.ts uses no dependencies, so nothing is installed next to the write token.
      - name: Commit and push
        shell: bash
        env:
          REF: ${{ needs.verify.outputs.ref }}
        run: |
          set -euo pipefail
          bun scripts/bump-pin.ts "$REF"
          if git diff --quiet -- pohunek.config.json; then
            echo "main already pins $REF"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pohunek.config.json
          git commit -m "Follow pohunek $REF"
          git push origin HEAD:main

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
