name: Follow ecosystem releases

# Moves every product pin in releases.config.json to the product's newest
# release once that release's install assets verify, records the changelog of
# every new release under src/data/changelog/, syncs every product's
# docs on its own, checks that the site still tests and builds, pushes the
# change to main and starts a deploy. One product's failing release or docs
# sync keeps its old pin and is reported while the products that passed still
# move. A push made with GITHUB_TOKEN does not start other workflows, so the
# deploy is started explicitly through workflow_dispatch, which GitHub exempts
# from that rule.
#
# Trust boundary: only this repository's dependency-free scripts (run with
# bun --no-install, so a new npm import fails loudly) produce the files that
# are committed. The job that installs and runs third-party code (verify)
# uploads no file for publish; it passes on only the ids of the products whose
# sync failed, and publish validates that list strictly.
#
#   collect   read-only token; verifies assets and attestations per product and
#             writes the data files of the products that passed, uploads them
#             as an artifact and names the main commit it started from. A
#             failing product keeps its old pin and is named in the outputs;
#             the step exits 2 and the run fails at the end through `report`.
#   verify    read-only token; takes collect's files, installs dependencies,
#             syncs every product's docs on its own (--keep-going), puts
#             every product whose sync failed back on its base-commit pin and
#             changelog, then tests and builds that tree. The build syncs again
#             at those pins without --keep-going, so a failure there fails the
#             job. Third-party build code runs only here. Output: the failed
#             product ids.
#   publish   contents: write; checks out the same commit without persisting
#             the token, applies collect's
#             artifact (by id, outside the checkout, only the expected regular
#             files), puts the failed-sync products back on their base state
#             with scripts/revert-products.ts and commits what is
#             left; only the final push step holds the token. The push is a fast-forward of that commit, so a main that
#             moved meanwhile fails the run instead of losing its change; the
#             next run starts from the new main. Nothing left to commit means
#             no deploy.
#   deploy    actions: write; dispatches deploy.yml when publish committed. A
#             failed dispatch is retried by re-running this job alone. The
#             deploy builds from the committed tree, where a product whose
#             sync failed is on its base pin again.
#   report    writes one row per product to the run summary and fails the run
#             when a product could not be followed or synced, after the other
#             products went through; the collect and verify logs name the
#             reason.
#
# Scheduled workflows of a public repository are disabled after 60 days
# without repository activity. A manual run (workflow_dispatch) is the fallback
# and re-enables the schedule. The repository_dispatch trigger lets a release
# workflow upstream ping this one once it holds a dispatch token.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Product id from releases.config.json (default: every product)"
        required: false
        type: string
      version:
        description: "Newer version to pin, X.Y.Z or X.Y.Z-pre.N; needs a product (default: newest release)"
        required: false
        type: string
  repository_dispatch:
    types: [pohunek-release]

permissions: {}

concurrency:
  group: follow-release
  cancel-in-progress: false

env:
  DATA_ARTIFACT: release-data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.follow.outputs.changed }}
      failed: ${{ steps.follow.outputs.failed }}
      failed_products: ${{ steps.follow.outputs.failed_products }}
      failed_reasons: ${{ steps.follow.outputs.failed_reasons }}
      moved_products: ${{ steps.follow.outputs.moved_products }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Follow the releases
        id: follow
        shell: bash
        # Exit 2 (some products failed, the rest moved) still records the pins that passed;
        # any other non-zero status fails the step and the run, as before this change.
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted input; follow-releases.ts validates the product id and the version.
          PRODUCT: ${{ inputs.product || github.event.client_payload.product }}
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$PRODUCT" ]; then args+=(--product "$PRODUCT"); fi
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          # Exit 2: some products failed and the others were followed; the report job fails the run.
          status=0
          bun --no-install scripts/follow-releases.ts "${args[@]}" > "$RUNNER_TEMP/outcomes.jsonl" || status=$?
          failed=false
          case "$status" in
            0) ;;
            2) failed=true ;;
            *) exit "$status" ;;
          esac
          # Every output is a single key=value line.
          bun --no-install scripts/follow-outcomes.ts "$failed" < "$RUNNER_TEMP/outcomes.jsonl" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- releases.config.json src/data/changelog)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.follow.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: |
            releases.config.json
            src/data/changelog/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      failed_sync_products: ${{ steps.sync.outputs.failed_sync_products }}
      failed_sync_reasons: ${{ steps.sync.outputs.failed_sync_reasons }}
      failed_sync: ${{ steps.sync.outputs.failed_sync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.collect.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact }}
          path: ${{ runner.temp }}/release-data
      - name: Take the collected data files
        run: scripts/take-release-data "$RUNNER_TEMP/release-data/$DATA_ARTIFACT"
      # The astro CLI runs on Node and needs a newer release than the runner image ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Sync each product's docs on its own
        id: sync
        shell: bash
        env:
          BASE: ${{ needs.collect.outputs.base }}
        run: |
          set -euo pipefail
          rm -f failed-sync.json
          bun scripts/sync-docs.ts --keep-going
          bun scripts/sync-screenshots.ts --keep-going
          bun scripts/sync-media.ts --keep-going
          bun scripts/failed-sync-outputs.ts > "$RUNNER_TEMP/sync-outputs"
          cat "$RUNNER_TEMP/sync-outputs" >> "$GITHUB_OUTPUT"
          FAILED_SYNC_PRODUCTS="$(grep '^failed_sync_products=' "$RUNNER_TEMP/sync-outputs" | cut -d= -f2-)" \
            bun scripts/revert-products.ts "$BASE"
      - run: bun run build

  publish:
    needs: [collect, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.collect.outputs.base }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact }}
          path: ${{ runner.temp }}/release-data
      - name: Take the collected data files
        run: scripts/take-release-data "$RUNNER_TEMP/release-data/$DATA_ARTIFACT"

      - name: Put the products whose sync failed back on their base state
        env:
          BASE: ${{ needs.collect.outputs.base }}
          # Validated against the base config by revert-products.ts: known ids only, bounded size.
          FAILED_SYNC_PRODUCTS: ${{ needs.verify.outputs.failed_sync_products }}
        run: bun --no-install scripts/revert-products.ts "$BASE"

      - name: Commit and push
        id: commit
        shell: bash
        env:
          MOVED_PRODUCTS: ${{ needs.collect.outputs.moved_products }}
          FAILED_SYNC_PRODUCTS: ${{ needs.verify.outputs.failed_sync_products }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish: the base commit already holds the final release data"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          summary="$(bun --no-install scripts/commit-summary.ts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.config.json src/data/changelog
          git commit -m "$summary"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The write token reaches only this step, which runs nothing but git.
      - name: Push
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # HEAD is the base commit plus one; a main that moved since then rejects this push.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main

  deploy:
    needs: publish
    if: needs.publish.outputs.committed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

  report:
    needs: [collect, verify, publish, deploy]
    if: always() && (needs.collect.outputs.failed == 'true' || needs.verify.outputs.failed_sync == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.collect.outputs.base }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Write the per-product table and fail the run
        env:
          COLLECT_FAILED_PRODUCTS: ${{ needs.collect.outputs.failed_products }}
          COLLECT_FAILED_REASONS: ${{ needs.collect.outputs.failed_reasons }}
          COLLECT_MOVED_PRODUCTS: ${{ needs.collect.outputs.moved_products }}
          VERIFY_FAILED_PRODUCTS: ${{ needs.verify.outputs.failed_sync_products }}
          VERIFY_FAILED_REASONS: ${{ needs.verify.outputs.failed_sync_reasons }}
        run: |
          set -euo pipefail
          bun --no-install scripts/follow-report.ts >> "$GITHUB_STEP_SUMMARY"
          echo "::error::some products could not be followed or synced; see the table above"
          exit 1
