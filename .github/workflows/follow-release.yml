name: Follow ecosystem releases

# Moves every product pin in releases.config.json to the product's newest
# release once that release's install assets verify, records the changelog of
# every new release under src/data/changelog/, checks that the site still tests
# and builds, pushes the change to main and starts a deploy. A push made with
# GITHUB_TOKEN does not start other workflows, so the deploy is started
# explicitly through workflow_dispatch, which GitHub exempts from that rule.
#
#   collect   read-only token; runs only this repository's dependency-free
#             scripts (no package install), verifies assets and writes the data
#             files, uploads them as an artifact.
#   verify    read-only token; installs dependencies, tests and builds with the
#             collected files. Third-party build code runs only here.
#   publish   contents: write; installs and runs nothing but git. It takes the
#             artifact of `collect`, refuses any path outside the data files,
#             commits and pushes.
#   deploy    actions: write; dispatches deploy.yml. A failed dispatch is
#             retried by re-running this job alone.
#   report    fails the run when a product could not be followed, after the
#             other products went through; the collect log names the reason.
#
# Scheduled workflows of a public repository are disabled after 60 days
# without repository activity. A manual run (workflow_dispatch) is the fallback
# and re-enables the schedule. The repository_dispatch trigger lets a release
# workflow upstream ping this one once it holds a dispatch token.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Product id from releases.config.json (default: every product)"
        required: false
        type: string
      version:
        description: "Newer version to pin, X.Y.Z or X.Y.Z-pre.N; needs a product (default: newest release)"
        required: false
        type: string
  repository_dispatch:
    types: [pohunek-release]

permissions: {}

concurrency:
  group: follow-release
  cancel-in-progress: false

env:
  DATA_ARTIFACT: release-data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.follow.outputs.changed }}
      summary: ${{ steps.follow.outputs.summary }}
      failed: ${{ steps.follow.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Follow the releases
        id: follow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted input; follow-releases.ts validates the product id and the version.
          PRODUCT: ${{ inputs.product || github.event.client_payload.product }}
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$PRODUCT" ]; then args+=(--product "$PRODUCT"); fi
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          # Exit 2: some products failed and the others were followed; the report job fails the run.
          status=0
          moved="$(bun scripts/follow-releases.ts "${args[@]}")" || status=$?
          case "$status" in
            0) echo "failed=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "failed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
          if [ -z "$(git status --porcelain -- releases.config.json src/data/changelog)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$moved" ]; then summary="Follow $moved"; else summary="Record ecosystem changelog"; fi
          {
            echo "changed=true"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"

      - if: steps.follow.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: |
            releases.config.json
            src/data/changelog/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.DATA_ARTIFACT }}
      # The astro CLI runs on Node and needs a newer release than the runner image ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  publish:
    needs: [collect, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.DATA_ARTIFACT }}

      - name: Commit and push
        shell: bash
        env:
          SUMMARY: ${{ needs.collect.outputs.summary }}
        run: |
          set -euo pipefail
          # Only the data files may change; anything else in the artifact is refused.
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' \
            | grep -Ev '^(releases\.config\.json|src/data/changelog/[a-z][a-z0-9-]*\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::the release data touches unexpected paths: $unexpected"
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "main already holds this release data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.config.json src/data/changelog
          git commit -m "$SUMMARY"
          git push origin HEAD:main

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

  report:
    needs: [collect, deploy]
    if: always() && needs.collect.outputs.failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail for the products that were not followed
        run: |
          echo "::error::some products could not be followed; see the 'Follow the releases' step of the collect job"
          exit 1
